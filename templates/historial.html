<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial</title>
</head>
<body>
    <h1>Historial de entrenamientos</h1>   
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Distancia (km)</th>
            <th>Tiempo (min)</th>
            <th>Tipo</th>
        </tr>
        {{range .}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Fecha.Format "02/01/2006"}}</td>
            <td>{{.DistanciaKm}}</td>
            <td>{{.TiempoMin}}</td>
            <td>{{.Tipo}}</td>
        </tr>
        {{end}}
    </table>
    <br><br>
    <a href="/">Volver al inicio</a>
</body>
</html>
